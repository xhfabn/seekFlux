spring:
  application:
    name: seekflux-content-server
  profiles:
    active: ${SEEKFLUX_ENV:local}
  datasource:
    url: ${POSTGRES_JDBC_URL:jdbc:postgresql://localhost:5432/seekflux}
    username: ${POSTGRES_USER:seekflux}
    password: ${POSTGRES_PASSWORD:seekflux_local}
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

seekflux:
  media-upload:
    endpoint: ${S3_ENDPOINT:http://127.0.0.1:9000}
    public-base: ${MINIO_PUBLIC_BASE:http://127.0.0.1:9000}
    bucket: ${MEDIA_BUCKET:seekflux-media}
    access-key: ${MINIO_ROOT_USER:seekflux}
    secret-key: ${MINIO_ROOT_PASSWORD:seekflux_local_secret}
    max-bytes: ${MEDIA_UPLOAD_MAX_BYTES:536870912}
  outbox:
    relay-delay-ms: ${OUTBOX_RELAY_DELAY_MS:1000}
    batch-size: ${OUTBOX_BATCH_SIZE:50}
    send-timeout-ms: ${OUTBOX_SEND_TIMEOUT_MS:10000}

server:
  port: ${CONTENT_SERVER_PORT:8081}
  tomcat:
    max-swallow-size: ${MEDIA_UPLOAD_MAX_BYTES:536870912}

spring.servlet.multipart:
  max-file-size: 512MB
  max-request-size: 512MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
      export:
        enabled: ${OTEL_TRACING_EXPORT_ENABLED:false}
