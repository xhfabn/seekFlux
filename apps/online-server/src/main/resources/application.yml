spring:
  application:
    name: seekflux-online-server
  profiles:
    active: ${SEEKFLUX_ENV:local}
  datasource:
    url: ${POSTGRES_JDBC_URL:jdbc:postgresql://localhost:5432/seekflux}
    username: ${POSTGRES_USER:seekflux}
    password: ${POSTGRES_PASSWORD:seekflux_local}
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

seekflux:
  multimodal:
    enabled: ${MULTIMODAL_ENABLED:false}
    endpoint: ${MULTIMODAL_MODEL_ENDPOINT:http://127.0.0.1:8090}
    index: ${MULTIMODAL_INDEX:seekflux-media-segments-v1}
    dimensions: ${MULTIMODAL_DIMENSIONS:768}
    query-segments: ${MULTIMODAL_QUERY_SEGMENTS:8}
  search:
    index: ${CONTENT_SEARCH_INDEX:seekflux-content-v1}
    policy-version: ${SEARCH_POLICY_VERSION:direct-hybrid-v1}
    request-deadline-ms: ${SEARCH_REQUEST_DEADLINE_MS:1200}
    blocked-tags: ${SEARCH_BLOCKED_TAGS:moderation:blocked,distribution:blocked,违规,下架}
    retrieval-pool:
      core-size: ${SEARCH_RETRIEVAL_CORE_SIZE:2}
      max-size: ${SEARCH_RETRIEVAL_MAX_SIZE:4}
      queue-capacity: ${SEARCH_RETRIEVAL_QUEUE_CAPACITY:50}
    semantic:
      dimensions: ${SEARCH_SEMANTIC_DIMENSIONS:64}
  retrieval:
    connect-timeout-ms: ${RETRIEVAL_CONNECT_TIMEOUT_MS:1000}
    read-timeout-ms: ${RETRIEVAL_READ_TIMEOUT_MS:1200}
  recommendation:
    cursor-secret: ${RECOMMENDATION_CURSOR_SECRET:seekflux-local-cursor-secret-change-me}
    source-timeout-ms: ${RECOMMENDATION_SOURCE_TIMEOUT_MS:1500}
    recall-pool:
      core-size: ${RECOMMENDATION_RECALL_CORE_SIZE:4}
      max-size: ${RECOMMENDATION_RECALL_MAX_SIZE:8}
      queue-capacity: ${RECOMMENDATION_RECALL_QUEUE_CAPACITY:100}
  outbox:
    relay-delay-ms: ${OUTBOX_RELAY_DELAY_MS:1000}
    batch-size: ${OUTBOX_BATCH_SIZE:50}
    send-timeout-ms: ${OUTBOX_SEND_TIMEOUT_MS:10000}

server:
  port: ${ONLINE_SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
      export:
        enabled: ${OTEL_TRACING_EXPORT_ENABLED:false}
