<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SeekFlux 推荐 Feed</title>
  <style>
    :root{--ink:#13221d;--green:#16634b;--orange:#e56b3f;--line:#d9e2dc;--paper:#f7f5ed}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font:15px/1.55 system-ui,sans-serif;background:radial-gradient(circle at 10% 0,#cfe9dc 0,transparent 32%),linear-gradient(145deg,var(--paper),#edf3ef)}.shell{max-width:1100px;margin:auto;padding:46px 20px 70px}.nav{display:flex;justify-content:flex-end;gap:18px}.nav a{color:var(--green);font-weight:750;text-decoration:none}.hero{padding:42px 0 25px}.brand{color:var(--orange);font-weight:850;letter-spacing:.16em}h1{font:800 clamp(42px,8vw,76px)/1 Georgia,serif;margin:12px 0}.lead{max-width:720px;color:#607069}.controls{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;background:#ffffffd9;border:1px solid var(--line);border-radius:20px;padding:12px;box-shadow:0 18px 60px #254b4017}.controls input{min-width:0;border:1px solid var(--line);border-radius:13px;padding:12px 14px;font:15px system-ui;background:#fff}.controls button,.more,.similar{border:0;border-radius:13px;background:var(--green);color:white;padding:12px 18px;font-weight:800;cursor:pointer}.meta{margin:24px 0 12px;color:#66766f}.results{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.card{background:#ffffffdf;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 12px 36px #173a2b0c}.card h2{font:750 22px Georgia,serif;margin:0 0 7px}.summary{color:#52635b}.tags,.sources{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.tag,.source{border-radius:999px;padding:3px 9px;font-size:12px}.tag{background:#e1f0e8;color:var(--green)}.source{background:#fff0e8;color:#a74322}.reason{font-size:13px;color:#738078}.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:13px}.media{color:var(--orange);font-weight:750;text-decoration:none}.similar{background:transparent;color:var(--green);border:1px solid var(--line);padding:7px 10px}.empty{grid-column:1/-1;text-align:center;border:1px dashed #afbeb5;border-radius:18px;padding:48px;color:#6e7d75}.more{display:none;margin:22px auto 0}.warn{color:#a74322}@media(max-width:750px){.controls{grid-template-columns:1fr}.results{grid-template-columns:1fr}.shell{padding-top:22px}}
  </style>
</head>
<body>
<main class="shell">
  <nav class="nav"><a href="/">关键词搜索 →</a><a href="http://localhost:8081/admin.html">画像管理 →</a></nav>
  <section class="hero"><div class="brand">SEEKFLUX · MULTI-SOURCE FEED</div><h1>可解释推荐 Feed</h1><p class="lead">将热门、显式兴趣和相似内容三路候选并行召回，经 RRF 融合、规则排序和多样性约束后返回。输入一个已发布内容 ID 可观察 Item-Item 召回。</p></section>
  <form class="controls" onsubmit="loadFeed(event,false)">
    <input id="interests" value="露营,亲子" placeholder="兴趣标签，以逗号分隔">
    <input id="seed" placeholder="可选：最近看过的内容 ID">
    <button>生成 Feed</button>
  </form>
  <div id="meta" class="meta">等待生成推荐</div>
  <section id="results" class="results"><div class="empty">先在画像管理页导入演示内容，等待发布后生成 Feed。</div></section>
  <button id="more" class="more" onclick="loadFeed(null,true)">加载下一页</button>
</main>
<script>
const $=id=>document.getElementById(id);let nextCursor=null;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function card(x){return `<article class="card"><h2>${esc(x.title)}</h2><div class="summary">${esc(x.summary)}</div><div class="tags">${x.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="sources">${[...x.sources].map(s=>`<span class="source">${esc(s)}</span>`).join('')}</div><div class="reason">${esc(x.reason)}</div><div class="foot"><span>融合分 ${Number(x.score).toFixed(3)}</span><span><button class="similar" onclick="loadSimilar('${esc(x.contentId)}')">看相似</button> · <a class="media" href="${esc(x.mediaUri)}" target="_blank" rel="noreferrer">查看 ↗</a></span></div></article>`}
async function request(url,append){$('meta').textContent='召回与排序中…';try{const res=await fetch(url,{headers:{'X-User-Id':'demo-user'}});const data=await res.json();if(!res.ok)throw new Error(data.message||res.statusText);nextCursor=data.nextCursor;$('more').style.display=nextCursor?'block':'none';if(!append)$('results').innerHTML='';if(data.items.length)$('results').insertAdjacentHTML('beforeend',data.items.map(card).join(''));else if(!append)$('results').innerHTML='<div class="empty">没有可推荐的已发布内容，请先导入并等待索引完成。</div>';$('meta').innerHTML=`请求 ${esc(data.requestId)} · 返回 ${data.items.length} 条${data.degraded?` · <span class="warn">已降级：${esc(data.unavailableSources.join(','))}</span>`:''}`;}catch(err){$('meta').textContent='推荐失败：'+err.message;$('results').innerHTML='<div class="empty">请确认 online-server 与 Elasticsearch 已启动。</div>'}}
function params(cursor){const p=new URLSearchParams({page_size:'12'});const interests=$('interests').value.trim(),seed=$('seed').value.trim();if(interests)p.set('interests',interests);if(seed)p.set('seed_content_id',seed);if(cursor)p.set('cursor',cursor);return p}
function loadFeed(e,append){e?.preventDefault();if(!append)nextCursor=null;request('/v1/feed?'+params(append?nextCursor:null),append)}
function loadSimilar(id){nextCursor=null;$('seed').value=id;const p=params(null);p.delete('seed_content_id');request('/v1/contents/'+encodeURIComponent(id)+'/similar?'+p,false)}
</script>
</body>
</html>
