<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SeekFlux 搜索</title>
<style>:root{--ink:#101c28;--blue:#165d83;--orange:#ee7752;--paper:#f6f4ee;--line:#dce2e4}*{box-sizing:border-box}body{margin:0;color:var(--ink);font:15px/1.55 system-ui,sans-serif;background:radial-gradient(circle at 82% 8%,#cce7ed 0,transparent 31%),linear-gradient(145deg,#f8f6ef,#edf2f2);min-height:100vh}.shell{max-width:1050px;margin:auto;padding:60px 20px}.brand{color:var(--orange);font-weight:850;letter-spacing:.18em}.hero{text-align:center;padding:40px 0 34px}h1{font:800 clamp(42px,8vw,78px)/1 Georgia,serif;margin:10px 0}.lead{color:#60717e}.searchbar{max-width:790px;margin:28px auto 12px;display:flex;background:white;border:1px solid var(--line);padding:7px;border-radius:999px;box-shadow:0 18px 60px #254b5b1c}input{flex:1;border:0;outline:0;padding:13px 18px;font:17px system-ui;background:transparent}button{border:0;border-radius:999px;background:var(--blue);color:#fff;padding:12px 24px;font-weight:800;cursor:pointer}.suggestions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.suggestions button{background:#fff;color:var(--blue);border:1px solid var(--line);padding:7px 13px}.meta{margin:25px 0 13px;color:#667680}.results{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.card{background:#ffffffd9;border:1px solid var(--line);border-radius:17px;padding:20px;box-shadow:0 12px 34px #1737470d}.card h2{margin:0 0 7px;font:750 22px Georgia,serif}.summary{color:#52636d}.tags{display:flex;gap:7px;flex-wrap:wrap;margin:13px 0}.tag{background:#e3f0f2;color:var(--blue);border-radius:999px;padding:3px 9px;font-size:13px}.foot{display:flex;justify-content:space-between;gap:12px;align-items:center;color:#7b858a;font-size:13px}.media{color:var(--orange);font-weight:750;text-decoration:none}.empty{text-align:center;padding:50px;color:#71808a;border:1px dashed #b8c4c8;border-radius:18px;grid-column:1/-1}.nav{position:absolute;right:22px;top:20px;display:flex;gap:18px}.nav a{color:var(--blue);font-weight:750;text-decoration:none}@media(max-width:700px){.results{grid-template-columns:1fr}.nav{position:static;justify-content:flex-end}.shell{padding-top:20px}.searchbar{border-radius:18px}.searchbar button{padding:10px 15px}}</style></head>
<body><main class="shell"><nav class="nav"><a href="/feed.html">推荐 Feed →</a><a href="http://localhost:8081/admin.html">画像管理 →</a></nav><section class="hero"><div class="brand">SEEKFLUX · KEYWORD SEARCH</div><h1>搜索已发布内容</h1><p class="lead">输入关键词或自然问题，检索由内容画像构建的 Elasticsearch 索引。</p><form class="searchbar" onsubmit="search(event)"><input id="query" autofocus placeholder="例如：杭州哪里适合露营？"><button>搜索</button></form><div class="suggestions"><button onclick="pick('杭州露营')">杭州露营</button><button onclick="pick('亲子周末')">亲子周末</button><button onclick="pick('咖啡教程')">咖啡教程</button><button onclick="pick('川西摄影')">川西摄影</button></div></section><div id="meta" class="meta">等待搜索</div><section id="results" class="results"><div class="empty">先在画像管理页导入演示内容，等待几秒后回来搜索。</div></section></main>
<script>const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function pick(q){$('query').value=q;search()}
async function search(e){e?.preventDefault();const q=$('query').value.trim();if(!q)return;$('meta').textContent='检索中…';$('results').innerHTML='';try{const res=await fetch('/v1/search?q='+encodeURIComponent(q));const data=await res.json();if(!res.ok)throw new Error(data.message||res.statusText);$('meta').textContent=`“${data.query}” 找到 ${data.total} 条结果 · Elasticsearch ${data.tookMillis} ms`;if(!data.hits.length){$('results').innerHTML='<div class="empty">没有匹配结果。可以尝试更短的关键词，或先去画像管理页导入演示数据。</div>';return}$('results').innerHTML=data.hits.map(x=>`<article class="card"><h2>${esc(x.title)}</h2><div class="summary">${esc(x.summary)}</div><div class="tags">${x.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="foot"><span>相关度 ${Number(x.score).toFixed(2)} · 画像 v${x.profileVersion}</span><a class="media" href="${esc(x.mediaUri)}" target="_blank" rel="noreferrer">查看内容 ↗</a></div></article>`).join('')}catch(err){$('meta').textContent='搜索失败：'+err.message;$('results').innerHTML='<div class="empty">请确认 online-server 与 Elasticsearch 已启动。</div>'}}
</script></body></html>
