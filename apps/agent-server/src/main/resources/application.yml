spring:
  application:
    name: seekflux-agent-server
  profiles:
    active: ${SEEKFLUX_ENV:local}
  datasource:
    url: ${POSTGRES_JDBC_URL:jdbc:postgresql://localhost:5432/seekflux}
    username: ${POSTGRES_USER:seekflux}
    password: ${POSTGRES_PASSWORD:seekflux_local}
  flyway:
    enabled: true
    locations: classpath:db/migration
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

seekflux:
  search:
    index: ${CONTENT_SEARCH_INDEX:seekflux-content-v1}
    policy-version: ${SEARCH_POLICY_VERSION:direct-hybrid-v1}
    request-deadline-ms: ${SEARCH_REQUEST_DEADLINE_MS:1200}
    blocked-tags: ${SEARCH_BLOCKED_TAGS:moderation:blocked,distribution:blocked,违规,下架}
    retrieval-pool:
      core-size: ${SEARCH_RETRIEVAL_CORE_SIZE:2}
      max-size: ${SEARCH_RETRIEVAL_MAX_SIZE:4}
      queue-capacity: ${SEARCH_RETRIEVAL_QUEUE_CAPACITY:50}
    semantic:
      dimensions: ${SEARCH_SEMANTIC_DIMENSIONS:64}
  retrieval:
    connect-timeout-ms: ${RETRIEVAL_CONNECT_TIMEOUT_MS:1000}
    read-timeout-ms: ${RETRIEVAL_READ_TIMEOUT_MS:1200}
  agent:
    timeout-ms: ${AGENT_REQUEST_TIMEOUT_MS:2500}
    llm:
      provider: ${AGENT_LLM_PROVIDER:deterministic}
      endpoint: ${AGENT_LLM_ENDPOINT:}
      api-key: ${AGENT_LLM_API_KEY:}
      model: ${AGENT_LLM_MODEL:gpt-4.1-mini}
      timeout-ms: ${AGENT_LLM_TIMEOUT_MS:1800}
      input-usd-per-million-tokens: ${AGENT_LLM_INPUT_USD_PER_MILLION_TOKENS:0}
      output-usd-per-million-tokens: ${AGENT_LLM_OUTPUT_USD_PER_MILLION_TOKENS:0}
    bulkhead:
      max-concurrent-model-calls: ${AGENT_MODEL_MAX_CONCURRENCY:4}
      max-concurrent-tool-calls: ${AGENT_TOOL_MAX_CONCURRENCY:8}
    cancel:
      signal-ttl-seconds: ${AGENT_CANCEL_SIGNAL_TTL_SECONDS:30}
      poll-interval-ms: ${AGENT_CANCEL_POLL_INTERVAL_MS:100}
    shutdown-grace-ms: ${AGENT_SHUTDOWN_GRACE_MS:5000}
    shadow:
      enabled: ${AGENT_SHADOW_ENABLED:false}
      sample-rate: ${AGENT_SHADOW_SAMPLE_RATE:0.0}
      candidate-version: ${AGENT_SHADOW_CANDIDATE_VERSION:deterministic-shadow-v1}
      queue-capacity: ${AGENT_SHADOW_QUEUE_CAPACITY:20}
    execution-pool:
      core-size: ${AGENT_EXECUTION_CORE_SIZE:2}
      max-size: ${AGENT_EXECUTION_MAX_SIZE:4}
      queue-capacity: ${AGENT_EXECUTION_QUEUE_CAPACITY:50}
    session-projection-ttl-hours: ${AGENT_SESSION_PROJECTION_TTL_HOURS:24}

server:
  port: ${AGENT_SERVER_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
      export:
        enabled: ${OTEL_TRACING_EXPORT_ENABLED:false}
