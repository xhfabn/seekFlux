openapi: 3.1.0
info:
  title: SeekFlux API
  version: 0.1.0
  description: SeekFlux content, search, recommendation, Agent Runtime, and interaction contracts.
servers:
  - url: http://localhost:8080
    description: Direct Search and recommendation
  - url: http://localhost:8083
    description: Agent Server
paths:
  /v1/agent/search:
    post:
      operationId: agentSearch
      summary: Execute the bounded Search Agent and fall back to Direct Search when required
      tags: [Agent]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentSearchRequest"
      responses:
        "200":
          description: Stable Agent terminal state, results, and correlated Agent/Search traces
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/AgentConflict"
        "503":
          $ref: "#/components/responses/AgentUnavailable"
  /v1/agent/sessions/{sessionId}:cancel:
    post:
      operationId: cancelAgentSession
      summary: Request cancellation of an Agent Session through the distributed interrupt signal
      tags: [Agent]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
      responses:
        "200":
          description: Whether the distributed cancellation signal was accepted
          content:
            application/json:
              schema:
                type: object
                required: [sessionId, cancelled]
                properties:
                  sessionId: {type: string}
                  cancelled: {type: boolean}
  /v1/agent/runtime/shadow:
    get:
      operationId: getAgentShadowSettings
      summary: Read the Redis-shared Agent shadow policy
      tags: [Agent]
      responses:
        "200":
          description: Current shadow settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentShadowSettings"
    put:
      operationId: updateAgentShadowSettings
      summary: Enable, sample, or disable Agent shadow evaluation across instances
      tags: [Agent]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentShadowSettings"
      responses:
        "200":
          description: Updated shadow settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentShadowSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/users/{userId}/interest-profile:
    get:
      operationId: getUserInterestProfile
      summary: Get the persisted explicit-interest profile used by recommendation
      tags: [UserInterest]
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
      responses:
        "200":
          description: Current persisted user interest profile, or an empty profile when none was saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInterestProfile"
    put:
      operationId: saveUserInterestProfile
      summary: Persist the explicit-interest profile used by subsequent feed requests
      tags: [UserInterest]
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserInterestProfileRequest"
      responses:
        "200":
          description: Persisted user interest profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInterestProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/search:
    get:
      operationId: searchByQueryParameter
      summary: Search published content profiles
      tags: [Search]
      parameters:
        - name: q
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 500}
        - name: page
          in: query
          schema: {type: integer, minimum: 0, default: 0}
        - name: size
          in: query
          schema: {type: integer, minimum: 1, maximum: 50, default: 12}
        - name: required_tags
          in: query
          description: Optional repeated exact tags that every returned content must contain.
          schema:
            type: array
            maxItems: 10
            items: {type: string, maxLength: 64}
      responses:
        "200":
          description: Hybrid Direct Search result page with retrieval trace and degradation state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResultPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/SearchUnavailable"
    post:
      operationId: search
      summary: Search published content profiles
      tags: [Search]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: Search result page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResultPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/SearchUnavailable"
  /v1/feed:
    get:
      operationId: getFeed
      summary: Get a feed strictly eligible for the persisted user-interest profile
      tags: [Recommendation]
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/RecommendationCursor"
        - $ref: "#/components/parameters/RecommendationPageSize"
        - $ref: "#/components/parameters/ExplicitInterests"
        - name: seed_content_id
          in: query
          description: Optional recently viewed content used by the similar-content recall source.
          schema: {type: string, maxLength: 128}
      responses:
        "200":
          description: Recommendation page with recall explanations and degradation state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationPage"
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/contents/{contentId}/similar:
    get:
      operationId: getSimilarContents
      summary: Get contents similar to one published content
      tags: [Recommendation]
      parameters:
        - $ref: "#/components/parameters/ContentId"
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/RecommendationCursor"
        - $ref: "#/components/parameters/RecommendationPageSize"
        - $ref: "#/components/parameters/ExplicitInterests"
      responses:
        "200":
          description: Similar-content page, or a marked trending fallback when no similar candidate is available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationPage"
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/contents:
    post:
      operationId: submitContent
      summary: Register content for asynchronous profile generation
      tags: [Content]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitContentRequest"
      responses:
        "202":
          description: Content stored and accepted for asynchronous processing
          headers:
            Location:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/contents/{contentId}:
    get:
      operationId: getContent
      tags: [Content]
      parameters:
        - $ref: "#/components/parameters/ContentId"
      responses:
        "200":
          description: Current content lifecycle state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: withdrawContent
      summary: Stop content distribution
      tags: [Content]
      parameters:
        - $ref: "#/components/parameters/ContentId"
      responses:
        "200":
          description: Withdrawn content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/contents/{contentId}/profile:
    put:
      operationId: completeContentProfile
      summary: Complete a versioned content profile
      description: Worker-facing idempotent endpoint; the basic local worker invokes the same use case directly.
      tags: [Content]
      parameters:
        - $ref: "#/components/parameters/ContentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteProfileRequest"
      responses:
        "200":
          description: Profile is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/contents/{contentId}/publish:
    post:
      operationId: publishContentProfile
      summary: Publish a ready content profile
      tags: [Content]
      parameters:
        - $ref: "#/components/parameters/ContentId"
      responses:
        "200":
          description: Published content profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/interactions:batch:
    post:
      operationId: reportInteractions
      tags: [Interaction]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string}
      responses:
        "202":
          description: Events accepted
components:
  parameters:
    ContentId:
      name: contentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserIdHeader:
      name: X-User-Id
      in: header
      required: false
      description: Local baseline identity. A gateway-authenticated identity replaces this header in production.
      schema: {type: string, maxLength: 128, default: anonymous}
    UserIdPath:
      name: userId
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 128}
    RecommendationCursor:
      name: cursor
      in: query
      required: false
      description: Opaque HMAC-signed cursor bound to the user, interests, scenario, and optional seed.
      schema: {type: string}
    RecommendationPageSize:
      name: page_size
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 50, default: 20}
    ExplicitInterests:
      name: interests
      in: query
      required: false
      description: Optional request-scoped override. When omitted, the persisted user profile is used.
      schema: {type: string, maxLength: 1300}
  schemas:
    AgentSearchOptions:
      type: object
      properties:
        allowClarification: {type: boolean, default: true}
    AgentSearchRequest:
      type: object
      required: [sessionId, turnId, query]
      properties:
        requestId: {type: string, maxLength: 128}
        sessionId: {type: string, minLength: 1, maxLength: 128}
        turnId: {type: string, minLength: 1, maxLength: 128}
        agentId:
          type: string
          maxLength: 128
          default: search-assistant
          enum: [search-assistant, search-precise]
        mode:
          type: string
          default: AUTO
          enum: [AUTO, DIRECT, AGENT]
          description: AUTO sends simple queries directly to Search and complex or multi-turn queries to the Agent.
        query: {type: string, minLength: 1, maxLength: 500}
        page: {type: integer, minimum: 0, default: 0}
        size: {type: integer, minimum: 1, maximum: 50, default: 12}
        requiredTags:
          type: array
          maxItems: 10
          items: {type: string, maxLength: 64}
        constraintPatch:
          $ref: "#/components/schemas/ConstraintPatchRequest"
        options:
          $ref: "#/components/schemas/AgentSearchOptions"
    ConstraintPatchRequest:
      type: object
      required: [baseVersion]
      description: Optimistic, version-checked update to the persisted Search Goal.
      properties:
        baseVersion: {type: integer, format: int64, minimum: 1}
        replacementQuery: {type: string, minLength: 1, maxLength: 500}
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1, maximum: 50}
        addRequiredTags:
          type: array
          maxItems: 10
          items: {type: string, maxLength: 64}
        removeRequiredTags:
          type: array
          maxItems: 10
          items: {type: string, maxLength: 64}
    QueryConstraintSet:
      type: object
      required: [page, size, requiredTags]
      properties:
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1, maximum: 50}
        requiredTags:
          type: array
          maxItems: 10
          items: {type: string, maxLength: 64}
    SearchPlan:
      type: object
      required: [originalQuery, rewrittenQuery, derivedRequiredTags, complex, reasons]
      properties:
        originalQuery: {type: string}
        rewrittenQuery: {type: string}
        derivedRequiredTags:
          type: array
          items: {type: string}
        complex: {type: boolean}
        reasons:
          type: array
          items:
            type: string
            enum: [LONG_NATURAL_LANGUAGE_QUERY, EXPLICIT_CONSTRAINT_LANGUAGE, MULTI_SLOT_QUERY, MULTI_TURN_GOAL]
    AgentStepTrace:
      type: object
      required: [step, action, status, tookMillis]
      properties:
        step: {type: integer, minimum: 1}
        action: {type: string, enum: [PLAN, CALL_TOOL, COMPLETE, CLARIFY, FALLBACK]}
        status: {type: string}
        toolCallId: {type: [string, "null"]}
        toolName: {type: [string, "null"]}
        linkedTraceId: {type: [string, "null"]}
        tookMillis: {type: integer, format: int64, minimum: 0}
        errorCode: {type: [string, "null"]}
    AgentShadowSettings:
      type: object
      required: [enabled, sampleRate]
      properties:
        enabled: {type: boolean}
        sampleRate: {type: number, format: double, minimum: 0, maximum: 1}
    AgentTrace:
      type: object
      required:
        - agentRunId
        - agentId
        - agentVersion
        - plannerVersion
        - promptVersion
        - decisionProviderVersion
        - toolSchemaVersions
        - startedAt
        - tookMillis
        - terminalState
        - executionMode
        - inputTokens
        - outputTokens
        - totalTokens
        - costMicros
        - usageMeasured
        - steps
      properties:
        agentRunId: {type: string, format: uuid}
        agentId: {type: string}
        agentVersion: {type: string}
        plannerVersion: {type: string}
        promptVersion: {type: string}
        decisionProviderVersion: {type: string}
        toolSchemaVersions:
          type: object
          additionalProperties: {type: string}
        startedAt: {type: string, format: date-time}
        tookMillis: {type: integer, format: int64, minimum: 0}
        terminalState:
          type: string
          enum: [RESULTS_READY, NEED_CLARIFICATION, FALLBACK_REQUIRED, CANCELLED, FAILED]
        executionMode:
          type: string
          enum: [AGENT, AGENT_TO_DIRECT_FALLBACK]
        fallbackReason: {type: [string, "null"]}
        inputTokens: {type: integer, format: int64, minimum: 0}
        outputTokens: {type: integer, format: int64, minimum: 0}
        totalTokens: {type: integer, format: int64, minimum: 0}
        costMicros:
          type: integer
          format: int64
          minimum: 0
          description: Provider cost in micro-US-dollars using the configured versioned price inputs.
        usageMeasured:
          type: boolean
          description: True only when the provider response included token usage.
        steps:
          type: array
          items:
            $ref: "#/components/schemas/AgentStepTrace"
    AgentSearchResponse:
      type: object
      required:
        - requestId
        - agentRunId
        - sessionId
        - turnId
        - state
        - executionMode
        - goalVersion
        - routeReason
        - searchPlan
        - appliedConstraints
        - total
        - page
        - size
        - items
        - agentTrace
        - successfulToolCount
        - candidateSetReused
        - degraded
      properties:
        requestId: {type: string}
        agentRunId: {type: [string, "null"], format: uuid}
        sessionId: {type: string}
        turnId: {type: string}
        state:
          type: string
          enum: [RESULTS_READY, NEED_CLARIFICATION, FALLBACK_RESULTS, CANCELLED, FAILED]
        executionMode:
          type: string
          enum: [DIRECT, AGENT, AGENT_TO_DIRECT_FALLBACK]
        goalVersion:
          type: integer
          format: int64
          minimum: 0
          description: Zero for stateless Direct routing; positive for a committed Agent Search Goal.
        routeReason:
          type: string
          enum: [SIMPLE_QUERY, COMPLEX_QUERY, MULTI_TURN_PATCH, EXPLICIT_DIRECT, EXPLICIT_AGENT]
        searchPlan:
          $ref: "#/components/schemas/SearchPlan"
        appliedConstraints:
          $ref: "#/components/schemas/QueryConstraintSet"
        clarification: {type: [string, "null"]}
        total: {type: integer, format: int64, minimum: 0}
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1, maximum: 50}
        items:
          type: array
          items:
            $ref: "#/components/schemas/SearchHit"
        searchTrace:
          oneOf:
            - $ref: "#/components/schemas/SearchTrace"
            - type: "null"
        agentTrace:
          oneOf:
            - $ref: "#/components/schemas/AgentTrace"
            - type: "null"
        selectedTool: {type: [string, "null"]}
        successfulToolCount: {type: integer, minimum: 0}
        candidateSetReused:
          type: boolean
          description: True when the response returns one Search Tool candidate set without Agent-side reranking.
        degraded: {type: boolean}
        fallbackReason: {type: [string, "null"]}
    UpdateUserInterestProfileRequest:
      type: object
      required: [topics]
      properties:
        topics:
          type: array
          maxItems: 20
          items: {type: string, minLength: 1, maxLength: 64}
    UserInterestProfile:
      type: object
      required: [userId, topics, updatedAt]
      properties:
        userId: {type: string}
        topics:
          type: array
          maxItems: 20
          items: {type: string}
        updatedAt: {type: string, format: date-time}
    SearchRequest:
      type: object
      required: [query]
      properties:
        query: {type: string, minLength: 1, maxLength: 500}
        page: {type: integer, minimum: 0, default: 0}
        size: {type: integer, minimum: 1, maximum: 50, default: 12}
        requiredTags:
          type: array
          maxItems: 10
          items: {type: string, maxLength: 64}
    SearchHit:
      type: object
      required: [contentId, creatorId, mediaUri, title, description, summary, tags, profileVersion, score, sources, publishedAt]
      properties:
        contentId: {type: string, format: uuid}
        creatorId: {type: string}
        mediaUri: {type: string}
        title: {type: string}
        description: {type: string}
        summary: {type: string}
        tags:
          type: array
          items: {type: string}
        profileVersion: {type: integer, minimum: 1}
        score: {type: number, format: double}
        sources:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [KEYWORD, SEMANTIC]
        publishedAt: {type: string, format: date-time}
    SearchResultPage:
      type: object
      required: [query, total, page, size, tookMillis, hits, trace]
      properties:
        query: {type: string}
        total: {type: integer, format: int64, minimum: 0}
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1}
        tookMillis: {type: integer, format: int64, minimum: 0}
        hits:
          type: array
          items:
            $ref: "#/components/schemas/SearchHit"
        trace:
          $ref: "#/components/schemas/SearchTrace"
    SearchChannelTrace:
      type: object
      required: [source, status, retrieverVersion, tookMillis, candidateCount]
      properties:
        source:
          type: string
          enum: [KEYWORD, SEMANTIC]
        status:
          type: string
          enum: [SUCCESS, FAILED, TIMED_OUT, REJECTED]
        retrieverVersion: {type: string}
        tookMillis: {type: integer, format: int64, minimum: 0}
        candidateCount: {type: integer, minimum: 0}
        errorCode:
          oneOf:
            - type: string
            - type: "null"
    SearchTrace:
      type: object
      required:
        - requestId
        - executionMode
        - indexVersion
        - policyVersion
        - tookMillis
        - degraded
        - unavailableSources
        - channels
      properties:
        requestId: {type: string}
        executionMode:
          type: string
          enum: [DIRECT_HYBRID, DIRECT_KEYWORD_FALLBACK, DIRECT_SEMANTIC_FALLBACK]
        indexVersion: {type: string}
        policyVersion: {type: string}
        tookMillis: {type: integer, format: int64, minimum: 0}
        degraded: {type: boolean}
        unavailableSources:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [KEYWORD, SEMANTIC]
        channels:
          type: array
          items:
            $ref: "#/components/schemas/SearchChannelTrace"
    RecommendationItem:
      type: object
      required:
        - contentId
        - creatorId
        - mediaUri
        - title
        - description
        - summary
        - tags
        - profileVersion
        - publishedAt
        - score
        - sources
        - reason
      properties:
        contentId: {type: string, format: uuid}
        creatorId: {type: string}
        mediaUri: {type: string}
        title: {type: string}
        description: {type: string}
        summary: {type: string}
        tags:
          type: array
          items: {type: string}
        profileVersion: {type: integer, minimum: 1}
        publishedAt: {type: string, format: date-time}
        score: {type: number, format: double}
        sources:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [TRENDING, INTEREST, SIMILAR]
        reason: {type: string}
    RecommendationPage:
      type: object
      required: [requestId, items, nextCursor, degraded, unavailableSources]
      properties:
        requestId: {type: string}
        items:
          type: array
          items:
            $ref: "#/components/schemas/RecommendationItem"
        nextCursor:
          oneOf:
            - type: string
            - type: "null"
        degraded: {type: boolean}
        unavailableSources:
          type: array
          items:
            type: string
            enum: [TRENDING, INTEREST, SIMILAR]
    SubmitContentRequest:
      type: object
      required: [creatorId, mediaUri, title]
      properties:
        creatorId:
          type: string
          maxLength: 128
        mediaUri:
          type: string
          maxLength: 2048
          examples: ["s3://seekflux-media/video-1.mp4"]
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 4000
          default: ""
        sourceTags:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 64
    CompleteProfileRequest:
      type: object
      required: [profileVersion, summary]
      properties:
        profileVersion:
          type: integer
          minimum: 1
        summary:
          type: string
          maxLength: 4000
        tags:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 64
        transcript:
          type: string
          maxLength: 50000
          default: ""
    ContentProfile:
      type: object
      required: [version, summary, tags, transcript]
      properties:
        version: {type: integer, minimum: 1}
        summary: {type: string}
        tags:
          type: array
          items: {type: string}
        transcript: {type: string}
    ContentResponse:
      type: object
      required:
        - contentId
        - creatorId
        - mediaUri
        - title
        - description
        - sourceTags
        - status
        - version
        - createdAt
        - updatedAt
      properties:
        contentId: {type: string, format: uuid}
        creatorId: {type: string}
        mediaUri: {type: string}
        title: {type: string}
        description: {type: string}
        sourceTags:
          type: array
          items: {type: string}
        status:
          type: string
          enum: [SUBMITTED, PROFILE_READY, PUBLISHED, WITHDRAWN]
        profile:
          oneOf:
            - $ref: "#/components/schemas/ContentProfile"
            - type: "null"
        version: {type: integer, format: int64}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        publishedAt:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        withdrawnAt:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
    ApiError:
      type: object
      required: [code, message, timestamp]
      properties:
        code: {type: string}
        message: {type: string}
        timestamp: {type: string, format: date-time}
  responses:
    BadRequest:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Content does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: Content lifecycle or optimistic-lock conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    SearchUnavailable:
      description: All Direct Search retrieval channels failed or exceeded the request deadline
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    AgentConflict:
      description: Agent Session is busy, the request id was already committed, or a Search Goal patch used a stale version
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    AgentUnavailable:
      description: Agent Runtime, Session store, or execution authority is unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
